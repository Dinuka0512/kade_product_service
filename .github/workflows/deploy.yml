name: Deploy Product Service

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Copy JAR to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          source: "target/product_service-0.0.1-SNAPSHOT.jar"
          target: "/home/dinuka0512/kade_be/kade_product_service/target"

      - name: Restart Product Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd /home/dinuka0512/kade_be/kade_product_service

            JAVA="/home/dinuka0512/.sdkman/candidates/java/current/bin/java"

            echo "Stopping old Product Service..."

            OLD_PID=$(ss -lntp 2>/dev/null | grep ':8002' | grep -o 'pid=[0-9]*' | cut -d= -f2 || true)

            if [ -n "$OLD_PID" ]; then
              echo "Found Product Service PID: $OLD_PID"
              kill $OLD_PID || true
              sleep 5
            fi

            echo "Starting new Product Service..."

            nohup "$JAVA" -jar target/product_service-0.0.1-SNAPSHOT.jar > product.log 2>&1 < /dev/null &

            sleep 20

            echo "Checking Product Service..."

            curl -f http://localhost:8002 > /dev/null

            echo "Product Service deployed successfully!"
